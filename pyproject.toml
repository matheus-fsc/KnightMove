[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knightmove"
version = "0.1.0"
description = "Knight's tour: enumeracao via espaco de ciclos GF(2) e invariantes topologicos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "networkx",
    "matplotlib",
    "z3-solver",
]

[project.optional-dependencies]
fast = ["numba"]
analysis = ["pandas", "scipy", "seaborn"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
